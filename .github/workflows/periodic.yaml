name: periodic

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: vexxhost/github-actions/scan-image@ee90fdf77bca9a1426af5073b44cae27dc0bdaca # main
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/openstack-database-exporter:edge
